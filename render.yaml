# Render Blueprint — deploys the backend (FastAPI) and frontend (Streamlit)
# as two separate web services. Deploy: push this repo to GitHub/GitLab,
# then in Render: New -> Blueprint -> select the repo.
#
# After the first deploy, two manual steps are required (Render assigns
# URLs only once a service exists, so they can't be templated in advance):
#   1. Copy the backend service's URL into the frontend service's
#      BACKEND_URL env var.
#   2. Copy the frontend service's URL into the backend service's
#      CORS_ORIGINS env var.
# Then trigger a redeploy of both. See README.md's "Deploying to Render"
# section for the full walkthrough, including which env vars you must fill
# in yourself (marked sync: false below — Render will prompt for these in
# the dashboard, they are never read from this file).
#
# Both services below run on Render's free plan — $0, but with no
# persistent disk. That means the backend's local filesystem (ingested
# documents / Chroma DB, uploaded files, quarantine, extra user accounts
# created via the Users page, logs) resets to empty on every restart —
# including a redeploy and the free plan's auto-sleep after ~15min idle.
# Login with the built-in ADMIN/SuperAdmin accounts (env vars below)
# always still works since those aren't stored on disk. If you need
# ingested documents / accounts to actually persist, switch the backend
# service's `plan` to `starter` and re-add a `disk:` block mounted at
# e.g. /var/data, pointing CHROMA_DIR/UPLOAD_ARCHIVE_DIR/QUARANTINE_DIR/
# USERS_FILE/TOKEN_USAGE_FILE/LOG_DIR at paths under it.

services:
  - type: web
    name: athena-backend
    runtime: python
    plan: free # no persistent disk on this plan — see the free-tier note near the bottom of this file
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6

      # ---- Gemini API ----
      - key: GEMINI_API_KEY
        sync: false # paste your key in the Render dashboard, never in git
      - key: GEMINI_LLM_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_EMBED_MODEL
        value: gemini-embedding-001

      # No CHROMA_DIR / UPLOAD_ARCHIVE_DIR / QUARANTINE_DIR / USERS_FILE /
      # TOKEN_USAGE_FILE / LOG_DIR overrides here — without a disk to point
      # them at, app/config.py's own backend/data/ defaults are used
      # instead, which live on this plan's ephemeral local filesystem (see
      # the free-tier note near the bottom of this file).

      # ---- YARA malware scanning ----
      - key: YARA_ENABLED
        value: "true"

      # ---- CORS — set to the frontend service's URL after it's created ----
      - key: CORS_ORIGINS
        sync: false

      # ---- JWT auth ----
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates a random secret for you
      - key: JWT_EXPIRY_MINUTES
        value: "60"

      # ---- Built-in accounts (must match athena-frontend's APP_USERNAME/SUPERADMIN_USERNAME) ----
      - key: APP_USERNAME
        value: ADMIN
      - key: APP_PASSWORD
        sync: false
      - key: SUPERADMIN_USERNAME
        value: SuperAdmin
      - key: SUPERADMIN_PASSWORD
        sync: false

      # ---- Login lockout email/SMS alerts (optional — leave unset to disable) ----
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: ALERT_ADMIN_EMAIL
        sync: false
      - key: ALERT_ADMIN_MOBILE
        sync: false

  - type: web
    name: athena-frontend
    runtime: python
    plan: free # cold-starts after ~15min idle; upgrade to starter to avoid that
    region: oregon
    rootDir: frontend
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      # Set to the athena-backend service's URL once it's been created.
      - key: BACKEND_URL
        sync: false
